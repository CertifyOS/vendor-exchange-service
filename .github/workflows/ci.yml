name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every action is pinned by commit SHA (playbook); the tag is a comment for readers and Renovate.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # `check` is the whole gate: Spotless, Checkstyle, SpotBugs, ArchUnit and unit tests, then the
      # integration tests on Testcontainers MongoDB. No secrets or environment variables are needed:
      # every no-default config key gets a value from the test profiles.
      - name: Check
        run: ./gradlew check --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/jacoco
            build/reports/checkstyle
            build/reports/spotbugs
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # gitleaks over the full history of the pushed ref; pinned by digest (v8.30.1). The official
      # GitHub Action needs a paid licence for organisation repositories, so the container is used.
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact --exit-code 1 .
