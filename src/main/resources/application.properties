# vendor-exchange-service
#
# One image, two roles: QUARKUS_PROFILE=prod,api or prod,worker. RoleProfileCheck refuses to boot
# with neither or both. %worker is the only profile that runs the JobRunr server.
#
# Keys under vendor-exchange.* are a closed @ConfigMapping (VendorExchangeConfig): an undeclared key
# under that prefix is rejected at boot (SRCFG00050), and a declared key with no default must be set
# by the environment or the boot fails. Test values live in the test profiles, never here.

quarkus.package.jar.enabled=true
quarkus.package.jar.type=fast-jar
quarkus.http.port=${PORT:8080}
quarkus.shutdown.timeout=${SHUTDOWN_TIMEOUT:30}
quarkus.shutdown.delay-enabled=${SHUTDOWN_DELAY_ENABLED:true}
quarkus.shutdown.delay=${SHUTDOWN_DELAY:10}

# Logging: JSON for Cloud Logging, with level renamed to severity. Plain text in dev and tests.
quarkus.log.console.json.enabled=true
quarkus.log.console.json.key-overrides=level=severity
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Telemetry exporters stay off until Step 7 wires them; otherwise the OTel exporter logs connection
# errors against localhost:4317 on every boot (file-ingestion's experience).
quarkus.otel.sdk.disabled=true
quarkus.log.sentry.enabled=false

# MongoDB. The connection string comes from the environment locally and from Secret Manager in prod.
quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=vendor_exchange
quarkus.mongodb.uuid-representation=standard
quarkus.mongodb.health.enabled=false
# Explicit, not a behaviour change: MongoDB 5.0+ already defaults a replica set to w:majority.
quarkus.mongodb.write-concern.w=majority
quarkus.mongodb.devservices.enabled=false
%prod.quarkus.mongodb.connection-string=${sm//vendor-exchange-mongodb-uri}

# Auth0 (operator endpoints). The default OIDC tenant stays disabled at the base level: local dev and
# CI have no AUTH0_ISSUER, and quarkus-oidc refuses to boot without either a real auth-server-url or
# tenant-enabled=false. %prod turns it on where the real values exist; a forgotten value then fails
# loud rather than booting misconfigured. Keycloak Dev Services are kept off as a second guard.
quarkus.oidc.tenant-enabled=false
quarkus.keycloak.devservices.enabled=false
%prod.quarkus.oidc.tenant-enabled=true
quarkus.oidc.auth-server-url=${AUTH0_ISSUER}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${AUTH0_AUDIENCE}

# HTTP-layer policy. /q/* is health, metrics and OpenAPI. /internal/* is the Pub/Sub push endpoint,
# which verifies its own identity token (PubSubPushAuthFilter, Step 5), so no bearer policy here.
quarkus.http.auth.permission.q.paths=/q/*
quarkus.http.auth.permission.q.policy=permit
quarkus.http.auth.permission.internal.paths=/internal/*
quarkus.http.auth.permission.internal.policy=permit
quarkus.http.auth.permission.api.paths=/vendor-exports/*
quarkus.http.auth.permission.api.policy=authenticated

# JobRunr. Storage is the quarkus-mongodb-client bean above; no separate storage-provider artifact.
quarkus.jobrunr.database.type=mongodb
quarkus.jobrunr.database.database-name=vendor_exchange
quarkus.jobrunr.jobs.default-number-of-retries=${vendor-exchange.job-retries}
quarkus.jobrunr.miscellaneous.allow-anonymous-data-usage=false
quarkus.jobrunr.background-job-server.enabled=false
quarkus.jobrunr.background-job-server.worker-count=4
quarkus.jobrunr.background-job-server.poll-interval-in-seconds=15
quarkus.jobrunr.dashboard.enabled=false
%worker.quarkus.jobrunr.background-job-server.enabled=true
# Dashboard on the worker only, on an internal port that no firewall rule exposes; reached through
# an IAP SSH tunnel (make tunnel-dashboard, Step 8). The worker test profile turns it back off.
%worker.quarkus.jobrunr.dashboard.enabled=true
%worker.quarkus.jobrunr.dashboard.port=8000

# vendor-exchange.* : required keys (no default in VendorExchangeConfig; the boot fails without them)
vendor-exchange.egress.url=${EGRESS_URL}
vendor-exchange.egress.iap-client-id=${EGRESS_IAP_CLIENT_ID}
vendor-exchange.vendor-bucket=${VENDOR_BUCKET}
vendor-exchange.dal.url=${DAL_URL}
vendor-exchange.dal.iap-client-id=${DAL_IAP_CLIENT_ID}
vendor-exchange.api-layer.url=${API_LAYER_URL}

# vendor-exchange.* : defaults that the deployment may override
vendor-exchange.enabled=${VENDOR_EXCHANGE_ENABLED:true}
vendor-exchange.job-retries=${JOB_RETRIES:8}
vendor-exchange.reconciler-stale-minutes=${RECONCILER_STALE_MINUTES:30}
vendor-exchange.egress.deadline-hours=${EGRESS_DEADLINE_HOURS:6}
vendor-exchange.egress.abandon-hours=${EGRESS_ABANDON_HOURS:48}
vendor-exchange.permissions.enforce=${PERMISSIONS_ENFORCE:false}

# vendor-exchange.* : swap-in points (plan section 2). Empty means absent: SmallRye maps an empty
# value to Optional.empty(), asserted by VendorExchangeConfigTest.
vendor-exchange.api-layer.client-id=${API_LAYER_CLIENT_ID:}
vendor-exchange.api-layer.client-secret=${API_LAYER_CLIENT_SECRET:}
vendor-exchange.pubsub.push-service-account=${PUBSUB_PUSH_SERVICE_ACCOUNT:}
vendor-exchange.pubsub.push-audience=${PUBSUB_PUSH_AUDIENCE:}
