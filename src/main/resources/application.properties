# Step 0 baseline. Step 1 adds the vendor-exchange.* mapping, Auth0, DAL client and the
# permission blocks; Step 8 wires Secret Manager values per environment.

quarkus.package.jar.enabled=true
quarkus.package.jar.type=fast-jar
quarkus.http.port=${PORT:8080}
quarkus.shutdown.timeout=${SHUTDOWN_TIMEOUT:30}
quarkus.shutdown.delay-enabled=${SHUTDOWN_DELAY_ENABLED:true}
quarkus.shutdown.delay=${SHUTDOWN_DELAY:10}
quarkus.log.console.json=true
quarkus.log.console.json.key-overrides=level=severity

quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=vendor_exchange
quarkus.mongodb.uuid-representation=standard
quarkus.mongodb.health.enabled=false
# Explicit, not a behaviour change: MongoDB 5.0+ already defaults a replica set to w:majority.
quarkus.mongodb.write-concern.w=majority
quarkus.mongodb.devservices.enabled=false

# The default OIDC tenant stays disabled at the base level: local dev and CI have no AUTH0_ISSUER,
# and quarkus-oidc refuses to boot without either a real auth-server-url or tenant-enabled=false.
# %prod turns it back on where the real secret exists (Step 1).
quarkus.oidc.tenant-enabled=false
quarkus.keycloak.devservices.enabled=false

quarkus.jobrunr.database.type=mongodb
quarkus.jobrunr.database.database-name=vendor_exchange
quarkus.jobrunr.jobs.default-number-of-retries=8
quarkus.jobrunr.dashboard.enabled=false
quarkus.jobrunr.miscellaneous.allow-anonymous-data-usage=false
quarkus.jobrunr.background-job-server.enabled=false
quarkus.jobrunr.background-job-server.worker-count=4
quarkus.jobrunr.background-job-server.poll-interval-in-seconds=15

# Role is selected by profile: QUARKUS_PROFILE=prod,api or prod,worker. RoleProfileCheck refuses to
# boot with neither or both. The worker profile is the only one that runs the JobRunr server.
%worker.quarkus.jobrunr.background-job-server.enabled=true

%prod.quarkus.mongodb.connection-string=${sm//vendor-exchange-mongodb-uri}
