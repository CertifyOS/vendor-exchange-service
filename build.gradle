plugins {
    id 'java'
    id 'io.quarkus'
    id 'checkstyle'
    id 'com.diffplug.spotless' version("${spotlessVersion}")
    id 'com.github.spotbugs' version("${spotbugsVersion}")
    id 'jacoco'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
    mavenLocal()
}

group "com.certifyos.vendor_exchange"
version = "1.0.0"
buildDir = System.getProperty("custom.buildDir", "build")

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-rest-client-jackson'
    // quarkus-oidc alone validates Auth0 tokens and provides the JsonWebToken CDI bean. No
    // quarkus-smallrye-jwt beside it: two bearer mechanisms are ambiguous (file-ingestion, Task 2.3).
    implementation 'io.quarkus:quarkus-oidc'
    implementation 'io.quarkus:quarkus-security'
    implementation 'io.quarkus:quarkus-mongodb-client'
    implementation 'io.quarkus:quarkus-cache'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'
    implementation 'io.quarkus:quarkus-opentelemetry'
    implementation 'io.quarkus:quarkus-logging-json'
    implementation 'io.quarkiverse.googlecloudservices:quarkus-google-cloud-secret-manager:2.15.0'
    // 2.1.3 fails to augment on Quarkus 3.33.3 (file-ingestion finding 2); 2.3.4 works.
    implementation 'io.quarkiverse.loggingsentry:quarkus-logging-sentry:2.3.4'
    // No separate JobRunr MongoDB storage-provider artifact exists on Maven Central: quarkus-jobrunr
    // uses the quarkus-mongodb-client bean above (file-ingestion finding 1).
    implementation "org.jobrunr:quarkus-jobrunr:${jobrunrVersion}"
    implementation 'com.google.cloud:google-cloud-storage:2.45.0'
    implementation 'com.google.cloud:google-cloud-pubsub:1.134.0'
    // UUIDv7 for event ids: JDK 21's java.util.UUID has no v7 factory (file-ingestion finding 66).
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'

    testImplementation 'io.quarkus:quarkus-jacoco'
    // quarkus-junit5 / quarkus-junit5-mockito are relocation aliases since Quarkus 3.31; these are
    // the real artifactIds.
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.quarkus:quarkus-junit-mockito'
    testImplementation 'io.quarkus:quarkus-test-security-jwt'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'org.testcontainers:mongodb:1.20.4'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.2'
    testImplementation 'org.awaitility:awaitility:4.2.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

sourceSets {
    integrationTest {
        java.srcDir file('src/integrationTest/java')
        resources.srcDir file('src/integrationTest/resources')
        compileClasspath += main.output + test.output
        runtimeClasspath += main.output + test.output
    }
}

checkstyle {
    toolVersion = "${checkstyleVersion}"
    configFile = file('config/checkstyle/checkstyle.xml')
}

jacoco {
    toolVersion = '0.8.12'
}

spotbugs {
    ignoreFailures = false
    showStackTraces = true
    showProgress = true
    reportsDir = file("$buildDir/reports/spotbugs")
    maxHeapSize = '1g'
    excludeFilter = file("config/spotbugs/exclude.xml")
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        toggleOffOn()
        trimTrailingWhitespace()
        endWithNewline()
        palantirJavaFormat()
        formatAnnotations()
    }
}

clean {
    delete sourceSets.integrationTest.output.classesDirs
    delete sourceSets.integrationTest.output.resourcesDir
    delete file("$buildDir/reports/tests/integrationTest")
    delete file("$buildDir/test-results/integrationTest")
}

checkstyleMain {
    dependsOn 'compileQuarkusGeneratedSourcesJava'
}

spotbugsMain {
    dependsOn 'compileQuarkusGeneratedSourcesJava'
}

task installGitHooks(type: Copy) {
    group = 'Setup'
    description = 'Installs Git hooks from the githooks directory to .git/hooks'
    from file('githooks')
    into '.git/hooks'
    fileMode = 0755
}

// unit test runner config, coverage and jacoco reporting
test {
    jacoco {
        excludeClassLoaders = ["*QuarkusClassLoader"]
        destinationFile = layout.buildDirectory.file("jacoco/jacoco.exec").get().asFile
    }
    finalizedBy 'jacocoTestReport'
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}

jacocoTestReport {
    dependsOn compileQuarkusGeneratedSourcesJava
    reports {
        csv.required = false
        html.required = true
        xml.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReports.xml')
    }
}

// integration test runner config, coverage and jacoco reporting
task integrationTest(type: Test) {
    group = "verification"
    description = "run integration tests"

    classpath = sourceSets.integrationTest.runtimeClasspath
    testClassesDirs = sourceSets.integrationTest.output.classesDirs

    useJUnitPlatform()

    jacoco {
        destinationFile = layout.buildDirectory.file("jacoco/integrationTest.exec").get().asFile
    }

    testLogging {
        events "passed", "skipped", "failed"
    }

    finalizedBy 'jacocoIntegrationTestReport'
}

check {
    dependsOn integrationTest
}

task jacocoIntegrationTestReport(type: JacocoReport) {
    dependsOn compileQuarkusGeneratedSourcesJava

    executionData integrationTest
    sourceSets sourceSets.main

    reports {
        csv.required = false
        html.required = true
        xml.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/integrationTest/html')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/integrationTest/jacocoIntegrationTestReports.xml')
    }
}

// unified all test runner
task testAll {
    group = "verification"
    description = "run all test types"
    dependsOn test, integrationTest
    integrationTest.mustRunAfter test
}
