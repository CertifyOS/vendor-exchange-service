plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    alias(libs.plugins.quarkus)
    alias(libs.plugins.spotless)
    alias(libs.plugins.spotbugs)
}

repositories {
    mavenCentral()
}

group "com.certifyos.vendor_exchange"
version = "1.0.0"

dependencies {
    implementation enforcedPlatform(libs.quarkus.bom)
    implementation libs.bundles.quarkus.runtime
    implementation libs.quarkus.google.cloud.secret.manager
    implementation libs.quarkus.logging.sentry
    // JobRunr storage is the quarkus-mongodb-client bean; no separate storage-provider artifact exists.
    implementation libs.quarkus.jobrunr
    implementation libs.google.cloud.storage
    implementation libs.google.cloud.pubsub
    // Declared, not left transitive: the Pub/Sub push verifier imports com.google.auth.oauth2.TokenVerifier.
    implementation libs.google.auth.oauth2.http
    // UUIDv7 for event ids: JDK 21's java.util.UUID has no v7 factory.
    implementation libs.java.uuid.generator

    testImplementation libs.bundles.quarkus.test
}

// Fail the build if a SNAPSHOT dependency ever appears (playbook: no SNAPSHOT on main).
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.version?.endsWith('-SNAPSHOT')) {
            throw new GradleException("SNAPSHOT dependency not allowed: ${details.requested}")
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

sourceSets {
    integrationTest {
        java.srcDir file('src/integrationTest/java')
        resources.srcDir file('src/integrationTest/resources')
        compileClasspath += main.output + test.output
        runtimeClasspath += main.output + test.output
    }
}

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configFile = file('config/checkstyle/checkstyle.xml')
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

spotbugs {
    ignoreFailures = false
    showStackTraces = true
    showProgress = false
    reportsDir = layout.buildDirectory.dir("reports/spotbugs").get().asFile
    maxHeapSize = '1g'
    excludeFilter = file("config/spotbugs/exclude.xml")
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        toggleOffOn()
        trimTrailingWhitespace()
        endWithNewline()
        palantirJavaFormat()
        formatAnnotations()
    }
}

clean {
    delete sourceSets.integrationTest.output.classesDirs
    delete sourceSets.integrationTest.output.resourcesDir
    delete layout.buildDirectory.dir("reports/tests/integrationTest")
    delete layout.buildDirectory.dir("test-results/integrationTest")
}

checkstyleMain {
    dependsOn 'compileQuarkusGeneratedSourcesJava'
}

spotbugsMain {
    dependsOn 'compileQuarkusGeneratedSourcesJava'
}

task installGitHooks(type: Copy) {
    group = 'Setup'
    description = 'Installs Git hooks from the githooks directory to .git/hooks'
    from file('githooks')
    into '.git/hooks'
    fileMode = 0755
}

// Unit tests: plain JUnit for logic plus ArchUnit. Zero retries, by policy.
test {
    useJUnitPlatform()
    jacoco {
        excludeClassLoaders = ["*QuarkusClassLoader"]
        destinationFile = layout.buildDirectory.file("jacoco/jacoco.exec").get().asFile
    }
    finalizedBy 'jacocoTestReport'
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}

jacocoTestReport {
    dependsOn compileQuarkusGeneratedSourcesJava
    reports {
        csv.required = false
        html.required = true
        xml.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReports.xml')
    }
}

// Integration tests: Quarkus wiring tests on the two role profiles against Testcontainers MongoDB.
task integrationTest(type: Test) {
    group = "verification"
    description = "run integration tests"

    classpath = sourceSets.integrationTest.runtimeClasspath
    testClassesDirs = sourceSets.integrationTest.output.classesDirs

    useJUnitPlatform()

    jacoco {
        destinationFile = layout.buildDirectory.file("jacoco/integrationTest.exec").get().asFile
    }

    testLogging {
        events "passed", "skipped", "failed"
    }

    finalizedBy 'jacocoIntegrationTestReport'
}

check {
    dependsOn integrationTest
}

task jacocoIntegrationTestReport(type: JacocoReport) {
    dependsOn compileQuarkusGeneratedSourcesJava

    executionData integrationTest
    sourceSets sourceSets.main

    reports {
        csv.required = false
        html.required = true
        xml.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/integrationTest/html')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/integrationTest/jacocoIntegrationTestReports.xml')
    }
}

task testAll {
    group = "verification"
    description = "run all test types"
    dependsOn test, integrationTest
    integrationTest.mustRunAfter test
}
